services:
  pg17:
    image: postgres:17
    environment:
      POSTGRES_USER: pq
      POSTGRES_PASSWORD: pq
      POSTGRES_DB: pq_test
    ports:
      - "54317:5432"
    volumes:
      - ./fixtures:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pq -d pq_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  pg14:
    image: postgres:14
    environment:
      POSTGRES_USER: pq
      POSTGRES_PASSWORD: pq
      POSTGRES_DB: pq_test
    ports:
      - "54314:5432"
    volumes:
      - ./fixtures:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pq -d pq_test"]
      interval: 2s
      timeout: 3s
      retries: 15
